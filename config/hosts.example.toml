# Bosun host configuration — example
#
# Copy to config/hosts.toml and edit. hosts.toml is gitignored.
# Full schema: docs/CONFIG-SCHEMA.md
#
# Required per host: display_name, hostname, port, user, identity_file, [mount] mode, and the
# [probe] table (interval_seconds, deep_probe). Everything in [session] is optional -- the whole
# table may be left out. Defaults: autostart = false, reconnect = true, tmux = false, and no
# tab_color / color_scheme (Windows Terminal then uses its own).
#
# autostart = true opens a Windows Terminal tab for that host when Bosun itself starts at Windows
# login (its own autostart). It does nothing on a manual start or a restart.

[global]
rclone_rc_port                  = 5572
rclone_config_path              = "%APPDATA%\\rclone\\rclone.conf"
probe_timeout_seconds           = 5
failures_before_unmount         = 3
backoff_seconds                 = [5, 15, 30, 60, 300]
mounted_probe_interval_seconds  = 60
mounted_deep_probe_interval_seconds = 300
suspend_unmount_timeout_seconds = 3
start_with_windows              = true

# Restore Claude Code sessions after a reboot or a Terminal exit (ADR-021). Off unless you set it:
# turning it on leads to a plugin you install into your own Claude Code. Not per host.
# [claude_sessions]
# enabled = false

# Start and resume Claude Code sessions remotely, from a Claude chat (ADR-024). Off unless you set it.
# When enabled, development_area is required and must be an existing folder: Bosun acts only inside
# it. %VAR% tokens are expanded when used. Not per host.
# [remote_sessions]
# enabled          = false
# development_area = "%USERPROFILE%\\Development"


# An always-on box on the LAN. Persistent mount, quiet session.
[hosts.example-nas]
display_name  = "Example NAS"
hostname      = "nas.example.internal"
port          = 22
user          = "youruser"
identity_file = "~/.ssh/id_ed25519"

  [hosts.example-nas.mount]
  mode                 = "persistent"
  drive                = "N:"
  remote_path          = "/volume1/share"
  vfs_cache_mode       = "writes"
  network_mode         = true
  idle_unmount_seconds = 0

  # Every [session] key is optional; values equal to the default are shown only for illustration.
  [hosts.example-nas.session]
  autostart    = false
  reconnect    = true
  tmux         = true
  tmux_session = "main"
  tab_color    = "#2D5F3F"
  color_scheme = "Campbell"

  [hosts.example-nas.probe]
  interval_seconds = 60
  deep_probe       = true


# A remote server that is not always up. On-demand, red tab, no polling.
[hosts.example-remote]
display_name  = "Example Remote"
hostname      = "remote.example.com"
port          = 22
user          = "youruser"
identity_file = "~/.ssh/id_ed25519"

  [hosts.example-remote.mount]
  mode                 = "on-demand"
  drive                = "R:"
  remote_path          = "/srv/app"
  vfs_cache_mode       = "writes"
  network_mode         = true
  idle_unmount_seconds = 900

  [hosts.example-remote.session]
  autostart    = false
  reconnect    = true
  tmux         = true
  tmux_session = "main"
  tab_color    = "#7A1F1F"
  color_scheme = "Campbell"

  [hosts.example-remote.probe]
  # 0 = not polled while idle. Once mounted it is still probed, at
  # global.mounted_probe_interval_seconds — see ADR-011.
  interval_seconds = 0
  deep_probe       = true


# A jump host: shell only, no mount.
[hosts.example-jump]
display_name  = "Example Jump"
hostname      = "jump.example.com"
port          = 22
user          = "youruser"
identity_file = "~/.ssh/id_ed25519"

  [hosts.example-jump.mount]
  mode = "none"

  [hosts.example-jump.session]
  autostart    = true
  reconnect    = true
  tmux         = false
  tab_color    = "#3A4A6B"
  color_scheme = "Campbell"

  [hosts.example-jump.probe]
  interval_seconds = 0
  deep_probe       = false


# The smallest valid host: no [session] table at all (shell tab with every default, Terminal's own
# colours) and a probe cadence you must choose. Uncomment to try it.
#
# [hosts.example-minimal]
# display_name  = "Example Minimal"
# hostname      = "minimal.example.com"
# port          = 22
# user          = "youruser"
# identity_file = "~/.ssh/id_ed25519"
#
#   [hosts.example-minimal.mount]
#   mode = "none"
#
#   [hosts.example-minimal.probe]
#   interval_seconds = 0
#   deep_probe       = false
