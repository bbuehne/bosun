name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NOTE: PublishTrimmed is deliberately absent.
      # Trimming is not supported for WPF and produces runtime failures.
      - name: Publish
        run: >
          dotnet publish src/Bosun/Bosun.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Bosun.exe
          generate_release_notes: true
